<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{name}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{url}}" />
    <link rel="icon" href="../assets/icons/{{slug}}.png" type="image/png" />
    <meta name="theme-color" content="{{ground}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Critters" />
    <meta property="og:title" content="{{name}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:image" content="{{share}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Inside another page (embed.js, or an iframe to ?embed): the picture alone (site.css).
      // 'soft' keeps the border and the picture's shape; 'plain' (&edge=none) fills the frame.
      const embedded = new URLSearchParams(location.search);
      if (embedded.has('embed')) {
        document.documentElement.dataset.embed = embedded.get('edge') === 'none' ? 'plain' : 'soft';
        if (embedded.get('credit') === 'off') document.documentElement.dataset.credit = 'off';
      }
      // The loading sketch needs a worker-drawn canvas; without one, or with reduced motion,
      // the page shows the still until the scene's first frame, as before (shell.ts).
      if (
        matchMedia('(prefers-reduced-motion: reduce)').matches ||
        !('transferControlToOffscreen' in HTMLCanvasElement.prototype) ||
        !('attachShadow' in Element.prototype)
      )
        document.documentElement.dataset.still = '';
    </script>
    <link rel="preload" href="../assets/fonts/GeneralSans-Semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../assets/masks/wide.png" as="image" media="(min-width: 641px)" crossorigin />
    <link rel="preload" href="../assets/masks/narrow.png" as="image" media="(max-width: 640px)" crossorigin />
    <link rel="stylesheet" href="../assets/site.css" />
    <!-- Without JavaScript nothing draws the sketch: show the still under it. -->
    <noscript
      ><style>
        .sketch {
          display: none;
        }
      </style></noscript
    >
    <style>
      {{still}}
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="8" />
        <feDisplacementMap in="SourceGraphic" scale="4.5" />
      </filter>
    </svg>
    <main class="page">
      <div class="stage">
        <div class="picture" {{sketch}}>
          <div id="scene" class="scene"></div>
          <div class="sketch" aria-hidden="true"></div>
        </div>
        <a class="credit" href="{{url}}" target="_blank" rel="noopener">Critters</a>
      </div>
      <div class="caption">
        <h1>{{title}}</h1>
        {{hint}}
        <nav aria-label="Animals">
          <ul class="badges">
            {{badges}}
          </ul>
        </nav>
        <!-- What this is, and the line that puts this animal on another page (shell.ts shows the buttons). -->
        <div class="tools">
          <button type="button" aria-expanded="false" aria-controls="about" hidden>About</button>
          <button type="button" aria-expanded="false" aria-controls="embed" hidden>Embed</button>
        </div>
        <div class="about panel" id="about" hidden>
          <p>{{about}}</p>
          <p class="links">
            By <a href="{{author_url}}">{{author}}</a>
            <a href="{{code_url}}">Code</a>
            <a href="{{kit_url}}">Kit</a>
            <a href="{{credits_url}}">Footage credits</a>
          </p>
        </div>
        <div class="embed panel" id="embed" data-src="{{site}}/embed.js" data-animal="{{slug}}" hidden>
          <div class="edges" role="group" aria-label="Edge">
            <button type="button" data-edge="soft" aria-pressed="true">Soft edge</button>
            <button type="button" data-edge="none" aria-pressed="false">Square</button>
          </div>
          <div class="line">
            <code></code>
            <button type="button" class="copy">Copy</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="../assets/shell.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
