<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animal Farm</title>
    <meta name="description" content="Interactive creature studies." />
    <style>
      :root {
        color-scheme: light dark;
        --page: #f1efe6;
        --ink: #1f2a1e;
        --muted: #56644f;
        --rule: rgba(31, 42, 30, 0.25);
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d1018;
          --ink: #efe6d8;
          --muted: #9d97aa;
          --rule: rgba(239, 230, 216, 0.25);
        }
      }
      body {
        margin: 0;
        padding: 0 16px;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding-block: clamp(32px, 10vh, 96px);
      }
      h1 {
        margin: 0 0 8px;
        font: italic 400 clamp(40px, 8vw, 64px)/1 var(--serif);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--rule);
      }
      li {
        border-bottom: 1px solid var(--rule);
      }
      a {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
        color: inherit;
        text-decoration: none;
      }
      a:hover strong,
      a:focus-visible strong {
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      strong {
        font: italic 400 24px/1.2 var(--serif);
      }
      span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Animal Farm</h1>
      <p>Interactive creature studies, built to one method and measured before they ship.</p>
      <ul>
        <li>
          <a href="frogs/"><strong>Night Chorus</strong><span>Frogs on lily pads</span></a>
        </li>
        <li>
          <a href="frogs/#day"><strong>Day Chorus</strong><span>The same pond at noon</span></a>
        </li>
      </ul>
    </main>
  </body>
</html>
