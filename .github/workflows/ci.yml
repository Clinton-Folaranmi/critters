name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Docs agree with the QA thresholds
        run: npm run docs:check
      - name: Build (package, demo, standalone)
        run: npm run build
      - name: Node QA (soaks, swims, allocation, sizes)
        run: npm run qa:node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa/.out/results/
          if-no-files-found: ignore
